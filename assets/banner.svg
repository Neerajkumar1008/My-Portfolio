  <line x1="479" y1="324" x2="479" y2="352" stroke="#0f172a" stroke-width="5.5" stroke-linecap="round"/>
  <line x1="479" y1="324" x2="515" y2="348" stroke="#0f172a" stroke-width="5.5" stroke-linecap="round"/>
  <line x1="479" y1="324" x2="452" y2="328" stroke="#0f172a" stroke-width="5.5" stroke-linecap="round"/>
  <line x1="479" y1="324" x2="506" y2="328" stroke="#0f172a" stroke-width="5.5" stroke-linecap="round"/>
