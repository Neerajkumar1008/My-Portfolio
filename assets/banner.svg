    <rect x="95"  y="205" width="10" height="35" rx="1" fill="#3b82f6" class="bar4" style="transform-origin:95px  240px"/>
    <rect x="107" y="212" width="10" height="28" rx="1" fill="#8b5cf6" class="bar5" style="transform-origin:107px 240px"/>
    <rect x="119" y="200" width="10" height="40" rx="1" fill="#3b82f6" class="bar6" style="transform-origin:119px 240px"/>
    <rect x="131" y="210" width="10" height="30" rx="1" fill="#3b82f6" class="bar7" style="transform-origin:131px 240px"/>
    <rect x="143" y="218" width="10" height="22" rx="1" fill="#8b5cf6" class="bar8" style="transform-origin:143px 240px"/>
    <rect x="155" y="204" width="10" height="36" rx="1" fill="#3b82f6" class="bar1" style="transform-origin:155px 240px"/>
    <rect x="167" y="211" width="10" height="29" rx="1" fill="#8b5cf6" class="bar2" style="transform-origin:167px 240px"/>
