<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 370">
  <defs>
    <style>
      .blink       { animation: blink 1s step-end infinite; }
      .pulse-dot   { animation: pulseDot 1.6s ease-in-out infinite; }
      .pulse-dot2  { animation: pulseDot 1.6s ease-in-out infinite 0.5s; }
      .flow-line   { stroke-dasharray: 6 4; animation: flowDash 1s linear infinite; }
      .flow-line2  { stroke-dasharray: 6 4; animation: flowDash 1s linear infinite 0.4s; }
      .float-gear  { animation: floatY 3.8s ease-in-out infinite; }
      .bar1  { animation: barPop 2.4s ease-in-out infinite; }
      .bar2  { animation: barPop 2.4s ease-in-out infinite 0.2s; }
      .bar3  { animation: barPop 2.4s ease-in-out infinite 0.4s; }
      .bar4  { animation: barPop 2.4s ease-in-out infinite 0.6s; }
      .bar5  { animation: barPop 2.4s ease-in-out infinite 0.8s; }
      .bar6  { animation: barPop 2.4s ease-in-out infinite 1.0s; }
      .bar7  { animation: barPop 2.4s ease-in-out infinite 1.2s; }
      .bar8  { animation: barPop 2.4s ease-in-out infinite 1.4s; }
      .progress-fill { animation: progressFill 3s ease-in-out infinite; }
      .hand-l { animation: typeL 0.5s ease-in-out infinite alternate; transform-origin: 385px 232px; }
      .hand-r { animation: typeR 0.5s ease-in-out infinite alternate; transform-origin: 468px 238px; }
      .float-code  { animation: floatCode 4.2s ease-in-out infinite; }
      .float-code2 { animation: floatCode 4.2s ease-in-out infinite 1.4s; }
      .float-code3 { animation: floatCode 4.2s ease-in-out infinite 2.7s; }

      @keyframes blink       { 0%,100%{opacity:1} 50%{opacity:0} }
      @keyframes pulseDot    { 0%,100%{r:2.5;opacity:0.85} 50%{r:4;opacity:1} }
      @keyframes flowDash    { to{stroke-dashoffset:-20} }
      @keyframes floatY      { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
      @keyframes barPop      { 0%,100%{opacity:0.75;transform:scaleY(1)} 50%{opacity:1;transform:scaleY(1.08)} }
      @keyframes progressFill{ 0%{width:0} 60%{width:148px} 90%{width:148px} 100%{width:0} }
      @keyframes typeL       { from{transform:translateY(0)} to{transform:translateY(-2.5px)} }
      @keyframes typeR       { from{transform:translateY(0)} to{transform:translateY(-2px) rotate(2deg)} }
      @keyframes floatCode   { 0%,100%{transform:translateY(0);opacity:0.4} 50%{transform:translateY(-8px);opacity:0.65} }
    </style>

    <linearGradient id="deskG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#243548"/>
      <stop offset="100%" stop-color="#131c2a"/>
    </linearGradient>
    <linearGradient id="chairG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#243548"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <!-- Floor shadow -->
  <ellipse cx="278" cy="358" rx="218" ry="11" fill="#060c18" opacity="0.55"/>


  <!-- ── Gear / Settings panel (top-center, like reference) ── -->
  <g class="float-gear">
    <rect x="308" y="10" width="50" height="50" rx="9" fill="#0d1e40" stroke="#3b82f6" stroke-width="1.5" opacity="0.92"/>
    <!-- Outer gear ring -->
    <circle cx="333" cy="35" r="11" fill="none" stroke="#3b82f6" stroke-width="2.8"/>
    <circle cx="333" cy="35" r="4.5" fill="#3b82f6"/>
    <!-- Gear teeth 8-point -->
    <rect x="330.5" y="20"  width="5" height="6" rx="1.2" fill="#3b82f6"/>
    <rect x="330.5" y="44"  width="5" height="6" rx="1.2" fill="#3b82f6"/>
    <rect x="344"   y="32.5" width="6" height="5" rx="1.2" fill="#3b82f6"/>
    <rect x="319"   y="32.5" width="6" height="5" rx="1.2" fill="#3b82f6"/>
    <rect x="341.5" y="21.5" width="5" height="5" rx="1.2" fill="#3b82f6" transform="rotate(45,344,24)"/>
    <rect x="320"   y="21.5" width="5" height="5" rx="1.2" fill="#3b82f6" transform="rotate(-45,322,24)"/>
    <rect x="341.5" y="43.5" width="5" height="5" rx="1.2" fill="#3b82f6" transform="rotate(-45,344,46)"/>
    <rect x="320"   y="43.5" width="5" height="5" rx="1.2" fill="#3b82f6" transform="rotate(45,322,46)"/>
    <!-- Small second gear (like reference) -->
    <circle cx="350" cy="22" r="6"   fill="none" stroke="#8b5cf6" stroke-width="1.8" opacity="0.75"/>
    <circle cx="350" cy="22" r="2.5" fill="#8b5cf6" opacity="0.75"/>
  </g>
  <!-- Dotted connector from gear to right monitor -->
  <line x1="333" y1="60" x2="333" y2="100" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4,3" opacity="0.3"/>

  <!-- ── Desk ── -->
  <path d="M30 260 L530 260 L538 276 L22 276 Z" fill="url(#deskG)"/>
  <line x1="30" y1="260" x2="530" y2="260" stroke="#3b82f6" stroke-width="0.8" opacity="0.4"/>
  <rect x="46"  y="276" width="12" height="80" rx="2" fill="#0f172a"/>
  <rect x="502" y="276" width="12" height="80" rx="2" fill="#0f172a"/>
  <line x1="52" y1="338" x2="508" y2="338" stroke="#0f172a" stroke-width="4"/>

  <!-- ── Left monitor ── -->
  <rect x="124" y="245" width="10" height="17" fill="#1e293b"/>
  <rect x="108" y="261" width="42"  height="4" rx="2" fill="#1e293b"/>
  <rect x="48"  y="122" width="182" height="140" rx="6" fill="#0f172a" stroke="#2d4a7a" stroke-width="1.8"/>
  <rect x="54"  y="128" width="170" height="128" rx="4" fill="#030b1a"/>
  <!-- Header -->
  <rect x="54"  y="128" width="170" height="13" rx="4" fill="#0d1e40"/>
  <circle cx="62"  cy="134" r="2"   fill="#ef4444"/>
  <circle cx="69"  cy="134" r="2"   fill="#f59e0b"/>
  <circle cx="76"  cy="134" r="2"   fill="#22c55e" class="pulse-dot"/>
  <text x="84" y="138" font-size="5.5" fill="#60a5fa" font-family="monospace" font-weight="bold">ANALYTICS DASHBOARD</text>
  <!-- Code lines -->
  <rect x="59" y="146" width="84"  height="3" rx="1" fill="#1e3a5f"/>
  <rect x="59" y="153" width="118" height="3" rx="1" fill="#3b82f6" opacity="0.5"/>
  <rect x="59" y="160" width="64"  height="3" rx="1" fill="#8b5cf6" opacity="0.55"/>
  <rect x="59" y="167" width="100" height="3" rx="1" fill="#1e3a5f"/>
  <rect x="59" y="174" width="76"  height="3" rx="1" fill="#3b82f6" opacity="0.4"/>
