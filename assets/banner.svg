  <polygon points="406,126 411,129 406,132" fill="#8b5cf6"/>
  <rect x="412" y="121" width="18" height="17" rx="4" fill="#0d2e1e" stroke="#22c55e" stroke-width="1"/>
  <text x="414" y="132" font-size="5.5" fill="#4ade80" font-family="monospace">Au</text>
