  <text x="247" y="185" font-size="5"   fill="#a78bfa" font-family="monospace">  quality score  : 99.2%</text>
  <text x="247" y="195" font-size="5"   fill="#60a5fa" font-family="monospace">  destination    : BigQuery</text>
  <text x="380" y="195" font-size="6"   fill="#3b82f6" font-family="monospace" class="blink">&#x2588;</text>
  <line x1="247" y1="202" x2="427" y2="202" stroke="#1e293b" stroke-width="0.8"/>
  <text x="247" y="212" font-size="5"   fill="#f59e0b" font-family="monospace">&#x25C8; BigQuery   &#xB7; connected</text>
  <text x="247" y="222" font-size="5"   fill="#f59e0b" font-family="monospace">&#x25C8; MS Fabric  &#xB7; connected</text>
  <text x="247" y="232" font-size="5"   fill="#22c55e" font-family="monospace">&#x25CF; GCP CI/CD  &#xB7; deployed</text>
